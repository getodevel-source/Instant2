[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instant2"
# La version vive en instant2_app/__init__.py: una sola fuente de verdad, para
# que el paquete instalado y el codigo no puedan desincronizarse.
dynamic = ["version"]
description = "Instant2: local Spanish dictation and natural voice reading"
# 3.12 y no 3.10: las versiones fijadas de abajo lo exigen (numpy 2.5.3 pide
# >=3.12) y es la version con la que corre la suite en los tres sistemas.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "getodevel-source" }]
# Versiones fijadas: Instant2 es una aplicacion, no una libreria, y estas son las
# que estan probadas en este equipo. `sherpa-onnx` es la de mas riesgo (se usa
# su API directa: from_transducer, VadModel), y una version nueva puede romper
# el arranque sin que nadie haya tocado el codigo.
dependencies = [
    "numpy==2.5.3",
    "sounddevice==0.5.6",
    "pyperclip==1.11.0",
    "sherpa-onnx==1.13.8",
    "keyboard==0.13.5; sys_platform == 'win32'",
    "pynput; sys_platform != 'win32'",
    # Wayland no permite leer teclas globales desde pynput. El atajo PTT se
    # registra con el portal GlobalShortcuts en Linux/Hyprland.
    "dbus-fast==5.2.0; sys_platform == 'linux'",
    # La bandeja (pystray) es lo único exclusivo de Windows; el panel Qt y
    # Pillow (icono de ventana) son iguales en los tres sistemas.
    "pystray==0.19.5; sys_platform == 'win32'",
    "Pillow==12.3.0",
    "PySide6==6.11.2",
    # Kokoro TTS se ejecuta por ONNX Runtime en CPU; no agrega PyTorch ni
    # descarga los pesos al instalar la aplicación.
    "kokoro-onnx==0.6.1",
    "misaki-fork==0.9.6",
    "onnxruntime==1.31.0",
    "espeakng-loader==0.2.4",
]

[project.scripts]
instant2 = "instant2_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# El overlay Qt Quick se carga por ruta (overlay.py): sin esto, un
# `pip install` de instant2 no lleva los .qml y el overlay no levanta.
[tool.setuptools.package-data]
instant2_app = ["qml/*.qml", "web/*.html", "web/*.ttf", "web/*-OFL.txt"]

[tool.setuptools.dynamic]
version = { attr = "instant2_app.__version__" }
