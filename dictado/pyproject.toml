[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instant"
# La version vive en instant_app/__init__.py: una sola fuente de verdad, para
# que el paquete instalado y el codigo no puedan desincronizarse.
dynamic = ["version"]
description = "Instant hold-to-talk ES offline: Parakeet v3 + Silero VAD, CPU-only"
# 3.12 y no 3.10: las versiones fijadas de abajo lo exigen (numpy 2.5.3 pide
# >=3.12) y es la version con la que corre la suite en los tres sistemas.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "getodevel-source" }]
# Versiones fijadas: Instant es una aplicacion, no una libreria, y estas son las
# que estan probadas en este equipo. `sherpa-onnx` es la de mas riesgo (se usa
# su API directa: from_transducer, VadModel), y una version nueva puede romper
# el arranque sin que nadie haya tocado el codigo.
dependencies = [
    "numpy==2.5.3",
    "sounddevice==0.5.6",
    "pyperclip==1.11.0",
    "sherpa-onnx==1.13.8",
    "keyboard==0.13.5; sys_platform == 'win32'",
    "pynput; sys_platform != 'win32'",
    # Wayland no permite leer teclas globales desde pynput. El atajo PTT se
    # registra con el portal GlobalShortcuts en Linux/Hyprland.
    "dbus-fast==5.2.0; sys_platform == 'linux'",
    # La bandeja (pystray) es lo único exclusivo de Windows; el panel Qt y
    # Pillow (icono de ventana) son iguales en los tres sistemas.
    "pystray==0.19.5; sys_platform == 'win32'",
    "Pillow==12.3.0",
    "PySide6==6.11.2",
]

[project.scripts]
instant = "instant_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# El overlay Qt Quick se carga por ruta (overlay.py): sin esto, un
# `pip install` de instant no lleva los .qml y el overlay no levanta.
[tool.setuptools.package-data]
instant_app = ["qml/*.qml", "web/*.html"]

[tool.setuptools.dynamic]
version = { attr = "instant_app.__version__" }
