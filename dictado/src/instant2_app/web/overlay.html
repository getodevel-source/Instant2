<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; color: #eaf3f4; font: 15px "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="announcement" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)"></div>
<!--QWEBCHANNEL-->
<script>
/* Overlay de Instant2 (daemon), en canvas2d. Una cápsula de 56 px reúne
   icono, estado, señal y atajo, con mensajes multilínea para los avisos.
   Los estilos classic (9 barras) y orbital (17 bandas interpoladas)
   comparten anatomía y usan exclusivamente el audio real del micrófono
   o la salida de Kokoro. El movimiento reducido conserva una señal estática.
   Protocolo con el daemon (QWebChannel): pushFrame(json) con
   {mode, message, keyLabel, style, level?, pitch?, bands?}. La paleta se resuelve
   desde instant2_app/branding.py (ver tests/test_overlay_palette.py). */
(() => {
  const PI = Math.PI;

  // Resolved from branding.PALETTE when the production page is composed.
  const PALETTE = /*OVERLAY_PALETTE*/;
  const MARGIN = 12;   // margen transparente para la sombra dibujada.

  const canvas = document.getElementById('c');
  const C = canvas.getContext('2d');
  const state = {
    mode: 'idle', message: '', keyLabel: 'F9', style: 'classic',
    target: { level: 0, pitch: 0.5, bands: new Array(9).fill(0) },
    level: 0, pitch: 0.5, bands: new Array(9).fill(0)
  };
  let running = false, lastMs = 0, timeS = 0, frameTimer = 0;
  let entranceStartMs = 0, exitStartMs = 0, modeStartMs = 0;
  let lastVisibleMode = 'idle', lastVisibleMessage = '';
  const motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  let reducedMotion = !!(motionQuery && motionQuery.matches);
  if (motionQuery) {
    const updateMotionPreference = (event) => {
      reducedMotion = !!event.matches;
      entranceStartMs = 0;
      exitStartMs = 0;
      if (state.mode !== 'idle') start();
    };
    if (motionQuery.addEventListener) motionQuery.addEventListener('change', updateMotionPreference);
    else if (motionQuery.addListener) motionQuery.addListener(updateMotionPreference);
  }

  const rgb = (hex) => {
    const v = parseInt(hex.slice(1), 16);
    return [v >> 16 & 255, (v >> 8) & 255, v & 255];
  };
  const rgba = (hex, a) => {
    const [r, g, b] = rgb(hex);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  };
  const mixHex = (h1, h2, t) => {
    const a = rgb(h1), b = rgb(h2);
    const v = a.map((x, i) => Math.round(x + (b[i] - x) * t));
    return '#' + v.map((channel) => channel.toString(16).padStart(2, '0')).join('');
  };
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    C.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Puente con el daemon ---
  let bridge = null;

  window.pushFrame = function (f) {
    const previousMode = state.mode;
    if (f.level !== undefined) state.target.level = f.level;
    if (f.pitch !== undefined) state.target.pitch = f.pitch;
    if (f.mode !== undefined) state.mode = f.mode;
    if (Array.isArray(f.bands) && f.bands.length === 9)
      state.target.bands = f.bands.map((value) => Math.max(0, Math.min(1, Number(value) || 0)));
    if (state.mode !== previousMode) {
      const changedAt = performance.now();
      modeStartMs = changedAt;
      if (previousMode === 'idle' && state.mode !== 'idle') {
        entranceStartMs = changedAt;
      }
      if (state.mode === 'idle' && previousMode !== 'idle') {
        exitStartMs = changedAt;
        lastVisibleMode = previousMode;
        lastVisibleMessage = state.message;
      }
      if (state.mode !== 'idle')
        exitStartMs = 0;
      if (!['listening', 'starting', 'read_speaking'].includes(state.mode)) {
        state.target.level = 0;
        state.target.pitch = 0.5;
        state.target.bands.fill(0);
      }
    }
    if (f.message !== undefined) state.message = f.message;
    if (state.mode !== 'idle') {
      lastVisibleMode = state.mode;
      lastVisibleMessage = state.message;
    }
    if (f.keyLabel) state.keyLabel = f.keyLabel;
    if (f.style) state.style = f.style;
    // A late audio flush must not keep the renderer running after dismissal.
    if (state.mode === 'idle') {
      state.target.level = 0;
      state.target.pitch = 0.5;
      state.target.bands.fill(0);
    }
    if (state.mode !== previousMode || f.message !== undefined) {
      document.getElementById('announcement').textContent = state.mode === 'idle' ? ''
        : (MODE_LABELS[state.mode] || '') + (state.message ? ': ' + state.message : '');
    }
    start();
  };
  if (typeof qt !== 'undefined' && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function (channel) {
      bridge = channel.objects.bridge;
      bridge.frame.connect(function (payload) {
        try {
          window.pushFrame(JSON.parse(payload));
        } catch (e) { /* frame corrupto: se descarta */ }
      });
      bridge.event(JSON.stringify({ kind: 'ready' }));
    });
  } else {
    // Sin canal no hay frames: se deja marca visible (y titulo) para el smoke.
    document.title = 'overlay-web sin-canal';
    C.fillStyle = "#ff908b";
    C.font = '12px sans-serif';
    C.fillText('sin canal', 16, 24);
  }
  if (!document.title)
    document.title = 'overlay-web';

  // --- Dibujo ---
  function roundRect(x, y, w, h, r) {
    if (typeof C.roundRect === "function") {
      C.beginPath();
      C.roundRect(x, y, w, h, r);
      return;
    }
    // QtWebEngine viejo / Chromium sin roundRect: mismo trazado a mano.
    const radius = Math.max(0, Math.min(r || 0, w / 2, h / 2));
    C.beginPath();
    C.moveTo(x + radius, y);
    C.lineTo(x + w - radius, y);
    C.arcTo(x + w, y, x + w, y + radius, radius);
    C.lineTo(x + w, y + h - radius);
    C.arcTo(x + w, y + h, x + w - radius, y + h, radius);
    C.lineTo(x + radius, y + h);
    C.arcTo(x, y + h, x, y + h - radius, radius);
    C.lineTo(x, y + radius);
    C.arcTo(x, y, x + radius, y, radius);
    C.closePath();
  }

  function drawGlass(box) {
    C.save();
    C.shadowColor = 'rgba(0,0,0,0.16)';
    C.shadowBlur = 10;
    C.shadowOffsetY = 3;
    const grad = C.createLinearGradient(0, box.y, 0, box.y + box.h);
    grad.addColorStop(0, rgba(PALETTE.glass, 0.97));
    grad.addColorStop(1, rgba(PALETTE.glass_alt, 0.98));
    C.fillStyle = grad;
    roundRect(box.x, box.y, box.w, box.h, box.r || 18);
    C.fill();
    C.restore();
    C.strokeStyle = rgba(PALETTE.line, 0.9);
    C.lineWidth = 1;
    roundRect(box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1, box.r || 18);
    C.stroke();
  }

  function drawCheck(cx, cy, size, color, lineWidth) {
    C.strokeStyle = color;
    C.lineWidth = lineWidth;
    C.lineCap = 'round';
    C.lineJoin = 'round';
    C.beginPath();
    C.moveTo(cx - size * 0.5, cy + size * 0.05);
    C.lineTo(cx - size * 0.12, cy + size * 0.42);
    C.lineTo(cx + size * 0.55, cy - size * 0.38);
    C.stroke();
  }

  const MODE_LABELS = {
    starting: 'PREPARANDO', listening: 'ESCUCHANDO', processing: 'TRANSCRIBIENDO',
    success: 'COMPLETADO', notice: 'AVISO', error: 'ERROR',
    read_preparing: 'PREPARANDO', read_speaking: 'LEYENDO', read_stopping: 'DETENIENDO',
    read_success: 'COMPLETADO', read_notice: 'AVISO', read_error: 'ERROR'
  };
  const clamp01 = (value) => Math.max(0, Math.min(1, value));
  const easeOut = (value) => 1 - Math.pow(1 - clamp01(value), 3);

  function fitText(text, width) {
    if (C.measureText(text).width <= width) return text;
    const characters = Array.from(text);
    while (characters.length && C.measureText(characters.join('') + '…').width > width)
      characters.pop();
    return characters.join('') + '…';
  }

  function wrapText(text, width) {
    const lines = [];
    let line = '';
    for (const word of text.split(/\s+/)) {
      if (line && C.measureText(line + ' ' + word).width > width) {
        lines.push(line);
        line = '';
      }
      // Split long device names/paths as well as ordinary sentences.
      for (const character of Array.from((line ? ' ' : '') + word)) {
        if (line && C.measureText(line + character).width > width) {
          lines.push(line);
          line = '';
        }
        line += character;
      }
    }
    if (line) lines.push(line);
    if (lines.length > 4) {
      lines[3] = fitText(lines.slice(3).join(' '), width);
      lines.length = 4;
    }
    return lines;
  }

  function drawStateIcon(cx, cy, color, mode) {
    C.save();
    C.translate(cx, cy);
    C.strokeStyle = color;
    C.lineWidth = 1.5;
    C.lineCap = 'round';
    C.lineJoin = 'round';
    C.beginPath();
    if (mode === 'success' || mode === 'read_success') {
      drawCheck(0, 0, 11, color, 1.6);
    } else if (mode === 'error' || mode === 'read_error' || mode === 'notice' || mode === 'read_notice') {
      C.arc(0, 0, 8, 0, PI * 2);
      C.moveTo(0, -4); C.lineTo(0, 1);
      C.moveTo(0, 4); C.lineTo(0, 4.2);
      C.stroke();
    } else if (mode.startsWith('read_')) {
      C.moveTo(-8, -3); C.lineTo(-4, -3); C.lineTo(1, -7);
      C.lineTo(1, 7); C.lineTo(-4, 3); C.lineTo(-8, 3); C.closePath();
      C.moveTo(5, -4); C.quadraticCurveTo(9, 0, 5, 4);
      C.moveTo(8, -7); C.quadraticCurveTo(14, 0, 8, 7);
      C.stroke();
    } else {
      roundRect(-3, -9, 6, 12, 3); C.stroke();
      C.beginPath(); C.arc(0, 0, 6, 0, PI);
      C.moveTo(0, 6); C.lineTo(0, 10);
      C.moveTo(-3, 10); C.lineTo(3, 10); C.stroke();
    }
    C.restore();
  }

  function drawSignal(cx, cy, mode, color) {
    const processing = ['starting', 'processing', 'read_preparing', 'read_stopping'].includes(mode);
    C.save();
    if (processing) {
      C.strokeStyle = rgba(color, .15);
      C.lineWidth = 1.7;
      C.beginPath(); C.arc(cx, cy, 7, 0, PI * 2); C.stroke();
      const angle = reducedMotion ? -PI / 2 : timeS * 3;
      C.strokeStyle = color;
      C.lineCap = 'round';
      C.beginPath(); C.arc(cx, cy, 7, angle, angle + PI * .65); C.stroke();
    } else {
      const count = state.style === 'classic' ? 9 : 17;
      const gap = state.style === 'classic' ? 5.5 : 3.3;
      const width = 2;
      for (let i = 0; i < count; i++) {
        const bandPosition = i / (count - 1) * 8;
        const lower = Math.floor(bandPosition);
        const fraction = bandPosition - lower;
        const band = state.bands[lower] * (1 - fraction) + state.bands[Math.min(8, lower + 1)] * fraction;
        const energy = clamp01(Math.max(band, state.level * .12));
        const height = 3 + 19 * energy;
        C.fillStyle = rgba(color, .4 + energy * .6);
        roundRect(cx + (i - (count - 1) / 2) * gap - width / 2, cy - height / 2, width, height, 1);
        C.fill();
      }
    }
    C.restore();
  }

  // Both preferences share the same compact anatomy and readable state labels.
  // Only the audio signal changes: 9 discrete bars or 17 interpolated bands.
  function drawIndicator(now, exiting = false) {
    const mode = exiting ? lastVisibleMode : state.mode;
    const message = exiting ? lastVisibleMessage : state.message;
    if (!MODE_LABELS[mode]) return;
    const reading = mode.startsWith('read_');
    const feedback = ['notice', 'error', 'read_notice', 'read_error'].includes(mode);
    const success = mode === 'success' || mode === 'read_success';
    const processing = ['starting', 'processing', 'read_preparing', 'read_stopping'].includes(mode);
    const statusColor = mode === 'error' || mode === 'read_error' ? PALETTE.red
      : feedback ? PALETTE.amber : success ? PALETTE.green
      : processing ? PALETTE.working : PALETTE.accent;
    C.font = '12px "Segoe UI", system-ui, sans-serif';
    const detail = message || (reading ? 'Lectura finalizada' : 'Copiado');
    const maxWidth = Math.min(440, window.innerWidth - MARGIN * 2);
    const w = feedback ? Math.min(maxWidth, Math.max(300, C.measureText(detail).width + 72)) : Math.min(344, maxWidth);
    const lines = feedback ? wrapText(detail, w - 72) : [];
    const h = feedback ? Math.max(72, 38 + lines.length * 16) : 56;
    const card = {x: (window.innerWidth - w) / 2, y: window.innerHeight - MARGIN - h, w, h, r: 17};
    const cx = card.x + w / 2;
    const cy = card.y + h / 2;
    let alpha = 1, scale = 1, offsetY = 0;
    if (!reducedMotion && exiting && exitStartMs) {
      const progress = easeOut((now - exitStartMs) / 160);
      alpha = 1 - progress; scale = 1 - progress * .015; offsetY = progress * 3;
    } else if (!reducedMotion && entranceStartMs) {
      const progress = easeOut((now - entranceStartMs) / 220);
      alpha = progress; scale = .985 + progress * .015; offsetY = (1 - progress) * 4;
      if (progress >= 1) entranceStartMs = 0;
    }
    C.save();
    C.globalAlpha = alpha;
    C.translate(cx, cy + offsetY); C.scale(scale, scale); C.translate(-cx, -cy);
    drawGlass(card);

    // Only state content enters; the surface stays steady between operations.
    const stateProgress = reducedMotion || exiting ? 1 : easeOut((now - modeStartMs) / 150);
    C.globalAlpha *= .55 + stateProgress * .45;
    C.translate(0, (1 - stateProgress) * 2);
    const iconY = feedback ? card.y + 26 : cy;
    roundRect(card.x + 12, iconY - 16, 32, 32, 11);
    C.fillStyle = rgba(statusColor, .075); C.fill();
    drawStateIcon(card.x + 28, iconY, statusColor, mode);
    C.textAlign = 'left'; C.textBaseline = 'middle';
    C.fillStyle = feedback ? statusColor : PALETTE.text;
    C.font = '600 10px "Segoe UI", system-ui, sans-serif';
    C.fillText(MODE_LABELS[mode], card.x + 55, card.y + (feedback ? 22 : 20));
    C.font = '10px "Segoe UI", system-ui, sans-serif';
    C.fillStyle = PALETTE.muted;
    if (feedback) {
      C.font = '12px "Segoe UI", system-ui, sans-serif';
      C.fillStyle = PALETTE.text;
      lines.forEach((line, index) => C.fillText(line, card.x + 55, card.y + 42 + index * 16));
    } else {
      let subtitle = reading ? 'Lectura · F10 para detener' : 'Dictado · soltá para pegar';
      if (success) subtitle = reading ? 'Lectura finalizada' : 'Copiado';
      else if (processing) subtitle = message || (reading ? 'Preparando la voz local…' : 'Procesando tu voz…');
      C.fillText(fitText(subtitle, 160), card.x + 55, card.y + 37);
      if (!success) {
        const voice = mixHex(statusColor, PALETTE.working, state.pitch * .25);
        const key = reading ? 'F10' : (state.keyLabel || 'F9');
        C.font = '600 10px "Segoe UI", system-ui, sans-serif';
        const chipW = Math.min(52, Math.max(32, C.measureText(key).width + 14));
        drawSignal(card.x + w - chipW - 50, cy, mode, voice);
        const chipX = card.x + w - chipW - 12;
        roundRect(chipX, cy - 12, chipW, 24, 7);
        C.fillStyle = rgba(PALETTE.line, .45); C.fill();
        C.fillStyle = PALETTE.muted; C.textAlign = 'center';
        C.fillText(fitText(key, chipW - 8), chipX + chipW / 2, cy);
      } else {
        C.fillStyle = rgba(statusColor, 0.5);
        C.beginPath(); C.arc(card.x + w - 24, cy, 2.5, 0, PI * 2); C.fill();
      }
    }
    C.restore();
  }

  function frame(now) {
    try {
      const dt = lastMs ? Math.min((now - lastMs) / 1000, 0.05) : 0.016;
      lastMs = now;
      timeS += dt;
      if (reducedMotion) {
        // Keep the listening signal readable without making it follow live
        // audio when the user has asked for reduced motion.
        state.level = 0;
        state.pitch = 0.5;
        state.bands.fill(0.18);
      } else {
        state.level += (state.target.level - state.level) * (1 - Math.exp(-dt / 0.090));
        state.pitch += (state.target.pitch - state.pitch) * (1 - Math.exp(-dt / 0.140));
        for (let i = 0; i < state.bands.length; i++) {
          const target = state.target.bands[i] || 0;
          const tau = target > state.bands[i] ? 0.055 : 0.135;
          state.bands[i] += (target - state.bands[i]) * (1 - Math.exp(-dt / tau));
        }
      }

      C.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (state.mode !== 'idle') {
        drawIndicator(now);
      } else if (exitStartMs && !reducedMotion) {
        if (now - exitStartMs < 160)
          drawIndicator(now, true);
        else
          exitStartMs = 0;
      } else if (reducedMotion) {
        exitStartMs = 0;
      }
    } catch (e) {
      // Un frame corrupto no mata el loop: se vuelve a idle limpio.
      exitStartMs = 0;
      state.mode = 'idle';
      try { C.clearRect(0, 0, window.innerWidth, window.innerHeight); } catch (ignored) {}
    }

    // In reduced-motion mode, draw once for each real state/audio update.
    // start() coalesces updates to at most 25 fps; no state keeps a render loop.
    if (reducedMotion) {
      running = false;
      return;
    }
    if (state.mode === 'idle' && !exitStartMs && !hasPending()) {
      running = false;
      return;
    }
    scheduleNextFrame();
  }

  function hasPending() {
    return state.target.level > 0.001 || state.target.pitch !== 0.5
      || state.target.bands.some((b) => b > 0.001);
  }

  function start() {
    if (running)
      return;
    running = true;
    lastMs = 0;
    if (reducedMotion && state.mode !== 'idle')
      scheduleNextFrame();
    else
      requestAnimationFrame(frame);
  }
  function scheduleNextFrame() {
    if (!running) return;
    if (frameTimer) window.clearTimeout(frameTimer);
    frameTimer = window.setTimeout(() => {
      frameTimer = 0;
      requestAnimationFrame(frame);
    }, reducedMotion ? 40 : 33);
  }
  start();
})();
</script>
</body>
</html>
