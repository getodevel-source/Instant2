<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!--QWEBCHANNEL-->
<script>
/* Overlay de Instant (daemon): misma anatomia que los overlays QML/Tk, en
   canvas2d. Dos estilos:
     classic  pastilla de vidrio con 9 barras que siguen su banda real, chip
              de tecla, spinner al transcribir, tilde verde + "Copiado" al
              confirmar.
     orbital  pastilla compacta con un espectro suave que sigue las bandas
              reales del microfono y transiciones breves entre estados.
   Protocolo con el daemon (QWebChannel): pushFrame(json) con
   {mode, message, keyLabel, style, level?, pitch?, bands?}. La paleta repite
   instant_app/branding.py (ver tests/test_overlay_palette.py). */
(() => {
  const PI = Math.PI;

  // Tokens de marca (espejo de branding.PALETTE).
  const PALETTE = {
    accent: "#55d5c8", working: "#8fd7e8", green: "#7cdda6", amber: "#f2c36a",
    red: "#ff908b", text: "#eaf3f4", muted: "#9db0b6", glass: "#1b2b34",
    glass_alt: "#0f1c23", line: "#28414a"
  };
  const MARGIN = 12;   // margen transparente para la sombra dibujada.

  const canvas = document.getElementById('c');
  const C = canvas.getContext('2d');
  const state = {
    mode: 'idle', message: '', keyLabel: 'F9', style: 'classic',
    target: { level: 0, pitch: 0.5, bands: new Array(9).fill(0) },
    level: 0, pitch: 0.5, bands: new Array(9).fill(0)
  };
  let running = false, lastMs = 0, timeS = 0;
  let entranceStartMs = 0, exitStartMs = 0;
  let lastVisibleMode = 'idle', lastVisibleMessage = '';

  const rgb = (hex) => {
    const v = parseInt(hex.slice(1), 16);
    return [v >> 16 & 255, (v >> 8) & 255, v & 255];
  };
  const rgba = (hex, a) => {
    const [r, g, b] = rgb(hex);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  };
  const mixHex = (h1, h2, t) => {
    const a = rgb(h1), b = rgb(h2);
    const v = a.map((x, i) => Math.round(x + (b[i] - x) * t));
    return '#' + v.map((channel) => channel.toString(16).padStart(2, '0')).join('');
  };

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    C.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Puente con el daemon ---
  let bridge = null;
  window.pushFrame = function (f) {
    const previousMode = state.mode;
    if (f.level !== undefined) state.target.level = f.level;
    if (f.pitch !== undefined) state.target.pitch = f.pitch;
    if (f.mode !== undefined) state.mode = f.mode;
    if (Array.isArray(f.bands) && f.bands.length === 9)
      state.target.bands = f.bands.map((value) => Math.max(0, Math.min(1, Number(value) || 0)));
    if (state.mode !== previousMode) {
      const changedAt = performance.now();
      if (previousMode === 'idle' && state.mode !== 'idle')
        entranceStartMs = changedAt;
      if (state.mode === 'idle' && previousMode !== 'idle') {
        exitStartMs = changedAt;
        lastVisibleMode = previousMode;
        lastVisibleMessage = state.message;
      }
      if (state.mode !== 'idle')
        exitStartMs = 0;
      if (state.mode !== 'listening' && state.mode !== 'starting') {
        state.target.level = 0;
        state.target.pitch = 0.5;
        state.target.bands.fill(0);
      }
    }
    if (f.message !== undefined) state.message = f.message;
    if (state.mode !== 'idle') {
      lastVisibleMode = state.mode;
      lastVisibleMessage = state.message;
    }
    if (f.keyLabel) state.keyLabel = f.keyLabel;
    if (f.style) state.style = f.style;
    start();
  };
  if (typeof qt !== 'undefined' && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function (channel) {
      bridge = channel.objects.bridge;
      bridge.frame.connect(function (payload) {
        try {
          window.pushFrame(JSON.parse(payload));
        } catch (e) { /* frame corrupto: se descarta */ }
      });
      bridge.event(JSON.stringify({ kind: 'ready' }));
    });
  } else {
    // Sin canal no hay frames: se deja marca visible (y titulo) para el smoke.
    document.title = 'overlay-web sin-canal';
    C.fillStyle = "#ff908b";
    C.font = '12px sans-serif';
    C.fillText('sin canal', 16, 24);
  }
  if (!document.title)
    document.title = 'overlay-web';

  // --- Dibujo ---
  function pillBox(textWidth, textHeight) {
    const feedback = state.mode === 'notice' || state.mode === 'error';
    const w = feedback ? Math.min(424, Math.max(300, textWidth + 104)) : 300;
    const h = feedback ? Math.max(78, textHeight + 34) : 78;
    return {
      w: w, h: h, x: (window.innerWidth - w) / 2,
      y: window.innerHeight - MARGIN - h, feedback: feedback
    };
  }

  function roundRect(x, y, w, h, r) {
    if (typeof C.roundRect === "function") {
      C.beginPath();
      C.roundRect(x, y, w, h, r);
      return;
    }
    // QtWebEngine viejo / Chromium sin roundRect: mismo trazado a mano.
    const radius = Math.max(0, Math.min(r || 0, w / 2, h / 2));
    C.beginPath();
    C.moveTo(x + radius, y);
    C.lineTo(x + w - radius, y);
    C.arcTo(x + w, y, x + w, y + radius, radius);
    C.lineTo(x + w, y + h - radius);
    C.arcTo(x + w, y + h, x + w - radius, y + h, radius);
    C.lineTo(x + radius, y + h);
    C.arcTo(x, y + h, x, y + h - radius, radius);
    C.lineTo(x, y + radius);
    C.arcTo(x, y, x + radius, y, radius);
    C.closePath();
  }

  function modeColor() {
    if (state.mode === 'notice') return PALETTE.amber;
    if (state.mode === 'error') return PALETTE.red;
    if (state.mode === 'success') return PALETTE.green;
    if (state.mode === 'processing') return PALETTE.working;
    return PALETTE.accent;
  }

  function drawGlass(box) {
    C.save();
    C.shadowColor = 'rgba(0,0,0,0.45)';
    C.shadowBlur = 16;
    C.shadowOffsetY = 6;
    const grad = C.createLinearGradient(0, box.y, 0, box.y + box.h);
    grad.addColorStop(0, rgba(PALETTE.glass, 0.92));
    grad.addColorStop(1, rgba(PALETTE.glass_alt, 0.94));
    C.fillStyle = grad;
    roundRect(box.x, box.y, box.w, box.h, box.r || 18);
    C.fill();
    C.restore();
    C.strokeStyle = rgba(PALETTE.line, 0.9);
    C.lineWidth = 1;
    roundRect(box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1, box.r || 18);
    C.stroke();
  }

  function drawCheck(cx, cy, size, color, lineWidth) {
    C.strokeStyle = color;
    C.lineWidth = lineWidth;
    C.lineCap = 'round';
    C.lineJoin = 'round';
    C.beginPath();
    C.moveTo(cx - size * 0.5, cy + size * 0.05);
    C.lineTo(cx - size * 0.12, cy + size * 0.42);
    C.lineTo(cx + size * 0.55, cy - size * 0.38);
    C.stroke();
  }

  function drawClassic() {
    const voice = mixHex(PALETTE.accent, PALETTE.working, state.pitch);
    const msgFont = '14px "Segoe UI", system-ui, sans-serif';
    C.font = msgFont;
    const textW = state.message ? C.measureText(state.message).width : 0;
    const box = pillBox(textW, state.message ? 20 : 0);
    drawGlass(box);

    const cx = box.x + box.w / 2;
    const cy = box.y + box.h / 2;

    if (box.feedback) {
      C.font = msgFont;
      C.fillStyle = state.mode === 'error' ? PALETTE.red : PALETTE.amber;
      C.textAlign = 'center';
      C.textBaseline = 'middle';
      C.fillText(state.message, cx, cy + 1);
      return;
    }

    if (state.mode === 'success') {
      drawCheck(cx - 34, cy, 22, PALETTE.green, 3);
      C.font = '14px "Segoe UI", system-ui, sans-serif';
      C.fillStyle = PALETTE.green;
      C.textAlign = 'center';
      C.textBaseline = 'middle';
      C.fillText('Copiado', cx + 14, cy + 1);
      return;
    }

    // Barras: 9 bandas reales, con ataque por nivel y vaiven por indice.
    const barX = cx - 56;
    const floorH = 5, maxH = 34;
    for (let i = 0; i < 9; i++) {
      const band = state.bands[i] || 0;
      const act = Math.max(state.level, band);
      const wob = 0.78 + 0.22 * Math.sin(timeS * 4.2 - i * 0.72);
      const h = Math.min(maxH, floorH + (maxH - floorH) * (0.28 * act + 0.72 * band) * wob);
      const x = barX + i * 12.5;
      C.fillStyle = voice;
      C.globalAlpha = 0.35 + 0.65 * Math.min(1, 0.4 * act + 0.6 * band);
      roundRect(x, cy - h / 2, 3, h, 1.5);
      C.fill();
      C.globalAlpha = 1;
    }

    if (state.mode === 'processing') {
      const t0 = (timeS * (1000 / 1150)) % 1;
      C.strokeStyle = PALETTE.working;
      C.lineWidth = 3;
      C.lineCap = 'round';
      C.beginPath();
      C.arc(cx, cy, 15, t0 * 2 * PI, t0 * 2 * PI + PI * 0.55);
      C.stroke();
    }

    // Chip de tecla.
    C.font = '600 12px "Segoe UI", system-ui, sans-serif';
    const label = state.keyLabel || 'F9';
    const chipW = Math.max(30, C.measureText(label).width + 16);
    const chipX = box.x + box.w - chipW - 14;
    roundRect(chipX, cy - 11, chipW, 22, 11);
    C.fillStyle = rgba(PALETTE.line, 0.55);
    C.fill();
    C.fillStyle = PALETTE.muted;
    C.textAlign = 'center';
    C.textBaseline = 'middle';
    C.fillText(label, chipX + chipW / 2, cy + 1);
  }

  function drawOrbital(now, exiting = false) {
    const mode = exiting ? lastVisibleMode : state.mode;
    const message = exiting ? lastVisibleMessage : state.message;
    const cx = window.innerWidth / 2;
    const card = { x: cx - 168, y: 26, w: 336, h: 102, r: 24 };
    const centerY = window.innerHeight / 2;
    const voice = mixHex(PALETTE.accent, PALETTE.working, state.pitch);
    const clamp01 = (value) => Math.max(0, Math.min(1, value));
    const easeOut = (value) => 1 - Math.pow(1 - clamp01(value), 3);

    let alpha = 1;
    let scale = 1;
    let offsetY = 0;
    if (exiting && exitStartMs) {
      const progress = easeOut((now - exitStartMs) / 190);
      alpha = 1 - progress;
      scale = 1 - progress * 0.04;
      offsetY = progress * 6;
    } else if (entranceStartMs) {
      const progress = easeOut((now - entranceStartMs) / 260);
      alpha = progress;
      scale = 0.96 + progress * 0.04;
      offsetY = (1 - progress) * 6;
      if (progress >= 1)
        entranceStartMs = 0;
    }

    C.save();
    C.globalAlpha *= alpha;
    C.translate(cx, centerY + offsetY);
    C.scale(scale, scale);
    C.translate(-cx, -centerY);

    if (!['starting', 'listening', 'processing', 'success', 'notice', 'error'].includes(mode)) {
      C.restore();
      return;
    }

    drawGlass(card);
    const headerY = card.y + 23;
    const signalY = card.y + 74;
    const processing = mode === 'processing';
    const feedback = mode === 'notice' || mode === 'error';
    const success = mode === 'success';
    const statusColor = mode === 'error' ? PALETTE.red
      : mode === 'notice' ? PALETTE.amber
      : success ? PALETTE.green
      : processing ? PALETTE.working : PALETTE.accent;

    // Un unico encabezado mantiene todos los estados dentro de la misma pieza.
    const breathe = 0.5 + 0.5 * Math.sin(timeS * 2.6);
    C.beginPath();
    C.arc(card.x + 23, headerY, 6.5, 0, 2 * PI);
    C.fillStyle = rgba(statusColor, 0.12 + breathe * 0.08);
    C.fill();
    C.beginPath();
    C.arc(card.x + 23, headerY, 3.3, 0, 2 * PI);
    C.fillStyle = statusColor;
    C.globalAlpha *= processing || feedback || success ? 0.9 : 0.7 + breathe * 0.3;
    C.fill();
    C.globalAlpha = alpha;

    const labels = {
      starting: 'PREPARANDO', listening: 'ESCUCHANDO',
      processing: 'TRANSCRIBIENDO', success: 'COMPLETADO',
      notice: 'AVISO', error: 'ERROR'
    };
    C.font = '700 10px "Segoe UI", system-ui, sans-serif';
    C.fillStyle = PALETTE.text;
    C.textAlign = 'left';
    C.textBaseline = 'middle';
    C.fillText(labels[mode], card.x + 39, headerY);

    if (!feedback && !success) {
      const key = state.keyLabel || 'F9';
      C.font = '600 10px "Segoe UI", system-ui, sans-serif';
      const chipW = Math.max(32, C.measureText(key).width + 16);
      const chipX = card.x + card.w - chipW - 15;
      roundRect(chipX, headerY - 11, chipW, 22, 11);
      C.fillStyle = rgba(PALETTE.line, 0.62);
      C.fill();
      C.fillStyle = PALETTE.muted;
      C.textAlign = 'center';
      C.fillText(key, chipX + chipW / 2, headerY);
    }

    C.strokeStyle = rgba(PALETTE.line, 0.46);
    C.lineWidth = 1;
    C.beginPath();
    C.moveTo(card.x + 20, card.y + 45.5);
    C.lineTo(card.x + card.w - 20, card.y + 45.5);
    C.stroke();

    if (processing) {
      // Un arco corto comunica trabajo en curso sin llenar la barra de efectos.
      C.strokeStyle = rgba(PALETTE.working, 0.16);
      C.lineWidth = 2;
      C.beginPath();
      C.arc(cx, signalY, 15, 0, 2 * PI);
      C.stroke();
      C.strokeStyle = PALETTE.working;
      C.lineWidth = 2.5;
      C.lineCap = 'round';
      const sweep = timeS * 1.25;
      C.beginPath();
      C.arc(cx, signalY, 15, sweep, sweep + 1.35);
      C.stroke();
    } else if (feedback || success) {
      if (success) {
        drawCheck(cx - 35, signalY, 17, PALETTE.green, 2.7);
        C.fillStyle = PALETTE.green;
        C.font = '700 11px "Segoe UI", system-ui, sans-serif';
        C.textAlign = 'left';
        C.fillText('TEXTO COPIADO', cx - 20, signalY, card.w - 90);
      } else {
        const detail = message || (mode === 'error' ? 'No se pudo completar' : 'Listo');
        C.strokeStyle = statusColor;
        C.lineWidth = 1.7;
        C.beginPath();
        C.arc(card.x + 26, signalY, 7, 0, 2 * PI);
        C.stroke();
        C.fillStyle = statusColor;
        C.font = '700 11px "Segoe UI", system-ui, sans-serif';
        C.textAlign = 'center';
        C.fillText(mode === 'error' ? '!' : 'i', card.x + 26, signalY + 0.5);
        C.fillStyle = PALETTE.text;
        C.font = '600 12px "Segoe UI", system-ui, sans-serif';
        C.textAlign = 'left';
        C.fillText(detail, card.x + 43, signalY, card.w - 64);
      }
    } else {
      // Las 9 bandas reales se interpolan en una forma continua; la energia,
      // y no un giro decorativo, determina el movimiento de cada barra.
      const barCount = 21;
      const barW = 3.4;
      const gap = 6.2;
      const totalW = barCount * barW + (barCount - 1) * gap;
      const startX = cx - totalW / 2;
      const level = clamp01(state.level);
      for (let i = 0; i < barCount; i++) {
        const bandPosition = i / (barCount - 1) * (state.bands.length - 1);
        const lower = Math.floor(bandPosition);
        const upper = Math.min(state.bands.length - 1, lower + 1);
        const fraction = bandPosition - lower;
        const spectrum = state.bands[lower] * (1 - fraction) + state.bands[upper] * fraction;
        let energy = clamp01(Math.max(spectrum, level * 0.14));
        if (mode === 'starting')
          energy = Math.max(energy, 0.035 + 0.025 * Math.sin(timeS * 3.2 - i * 0.38));
        const height = 2.5 + 28 * energy;
        const x = startX + i * (barW + gap);
        const color = mixHex(PALETTE.accent, voice, i / (barCount - 1) * 0.34);
        C.globalAlpha = alpha * (0.38 + 0.62 * clamp01(energy * 1.8));
        C.fillStyle = color;
        roundRect(x, signalY - height / 2, barW, height, barW / 2);
        C.fill();
      }
    }
    C.restore();
  }
  function frame(now) {
    try {
      const dt = lastMs ? Math.min((now - lastMs) / 1000, 0.05) : 0.016;
      lastMs = now;
      timeS += dt;
      state.level += (state.target.level - state.level) * (1 - Math.exp(-dt / 0.090));
      state.pitch += (state.target.pitch - state.pitch) * (1 - Math.exp(-dt / 0.140));
      for (let i = 0; i < state.bands.length; i++) {
        const target = state.target.bands[i] || 0;
        const tau = target > state.bands[i] ? 0.055 : 0.135;
        state.bands[i] += (target - state.bands[i]) * (1 - Math.exp(-dt / tau));
      }

      C.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (state.mode !== 'idle') {
        if (state.style === 'orbital')
          drawOrbital(now);
        else
          drawClassic();
      } else if (exitStartMs) {
        if (now - exitStartMs < 190 && state.style === 'orbital')
          drawOrbital(now, true);
        else
          exitStartMs = 0;
      }
    } catch (e) {
      // Un frame corrupto no mata el loop: se vuelve a idle limpio.
      exitStartMs = 0;
      state.mode = 'idle';
      try { C.clearRect(0, 0, window.innerWidth, window.innerHeight); } catch (ignored) {}
    }

    if (state.mode === 'idle' && !exitStartMs && !hasPending()) {
      running = false;
      return;
    }
    requestAnimationFrame(frame);
  }

  function hasPending() {
    return state.target.level > 0.001 || state.target.pitch !== 0.5
      || state.target.bands.some((b) => b > 0.001);
  }

  function start() {
    if (running)
      return;
    running = true;
    lastMs = 0;
    requestAnimationFrame(frame);
  }
  start();
})();
</script>
</body>
</html>
