name: tests

# Puerta de pruebas: corre en cada push y cada PR. El workflow de release solo
# se dispara al tagear, asi que sin esto un cambio podia llegar a un release
# sin que nadie hubiera corrido la suite.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

# Un push nuevo sobre la misma rama cancela la corrida anterior.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Las dependencias de audio no hacen falta para la suite (los tests
      # simulan sounddevice), pero Qt ahora es la UI de los tres sistemas y
      # sus tests corren en los tres: en Linux hacen falta las libs del
      # sistema que el wheel de PySide6 no trae.
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libcups2 \
            libatk-bridge2.0-0 libgbm1 libasound2t64 libxcb-cursor0 || true

      - name: Install Qt
        run: python -m pip install PySide6

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./dictado
          python -m pip install pyflakes

      - name: Run test suite
        working-directory: dictado
        run: python -m unittest discover -s tests

      # pyflakes no entiende `# noqa`. En `gui.py` los nombres de Qt vuelven por
      # locals() y las clases los usan por `qt[...]`, asi que aparecen como no
      # usados; ese ruido conocido se filtra y la verificacion se queda con lo
      # que importa: nombres indefinidos y redefiniciones.
      - name: Check for undefined names
        shell: python
        run: |
          import glob, subprocess, sys
          files = sorted(glob.glob("dictado/src/instant2_app/*.py"))
          result = subprocess.run(
              [sys.executable, "-m", "pyflakes", *files],
              capture_output=True, text=True)
          findings = [line for line in result.stdout.splitlines()
                      if "imported but unused" not in line]
          for line in findings:
              print(line)
          if findings:
              sys.exit(f"pyflakes: {len(findings)} hallazgo(s)")

      - name: Check the CLI starts
        run: python -m instant2_app --help
