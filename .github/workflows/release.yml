name: release

on:
  push:
    tags:
      - "instant2-v*"

jobs:
  # La suite tiene que pasar antes de construir nada: un tag no deberia poder
  # publicar un binario de codigo roto.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary_name: Instant2
            output: Instant2.exe
          - os: ubuntu-latest
            platform: linux
            binary_name: instant2-linux
            output: instant2-linux
          - os: macos-latest
            platform: macos
            binary_name: instant2-macos
            output: instant2-macos
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pineadas por SHA (`action@SHA  # tag`): el SHA es lo que
      # realmente corre, el tag es solo legible. Refrescar con `git ls-remote`
      # del repo de cada action y actualizar ambas partes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Tiene que coincidir con lo que exigen las dependencias fijadas y con
          # la version que usa la suite: numpy 2.5.3 pide Python 3.12 o mas, y
          # con 3.11 la instalacion falla antes de construir.
          python-version: "3.12"

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xclip xdotool
          # El panel y el overlay web necesitan el stack de QtWebEngine (EGL/GL
          # incluidos) también para correr el smoke del binario congelado.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libcups2 \
            libatk-bridge2.0-0 libgbm1 libasound2t64 libxcb-cursor0 || true

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install package + PyInstaller
        shell: bash
        run: |
          pip install ./dictado
          pip install pyinstaller==6.22.3

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        run: python dictado/build_icon.py

      - name: Version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#instant2-v}"
          APP_VERSION="$(python -c 'import sys; sys.path.insert(0, "dictado/src"); from instant2_app import __version__; print(__version__)')"
          test "$TAG_VERSION" = "$APP_VERSION"

      - name: Build Windows portable (onefile)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ICON_PATH="$(python -c 'import os; print(os.path.abspath("dictado/build/instant2.ico"))')"
          # Custom hooks restrict QML, QtWebEngine, and Pillow to what Instant2 uses.
          pyinstaller --onefile --windowed --name "${{ matrix.binary_name }}" \
            --icon "$ICON_PATH" \
            --hidden-import instant2_app.gui \
            --hidden-import instant2_app.branding \
            --hidden-import pyexpat \
            --hidden-import PySide6.QtQml \
            --hidden-import PySide6.QtQuick \
            --additional-hooks-dir dictado/hooks \
            --add-data "dictado/src/instant2_app/qml/overlay_web_host.qml;instant2_app/qml" \
            --add-data "dictado/src/instant2_app/qml/panel_web_host.qml;instant2_app/qml" \
            --add-data "dictado/src/instant2_app/web/overlay.html;instant2_app/web" \
            --add-data "dictado/src/instant2_app/web/panel.html;instant2_app/web" \
            --add-data "dictado/src/instant2_app/web/Manrope.ttf;instant2_app/web" \
            --add-data "dictado/src/instant2_app/web/Manrope-OFL.txt;instant2_app/web" \
            --add-data "scripts/instant2-update.bat;." \
            --hidden-import PySide6.QtWebEngineQuick \
            --hidden-import PySide6.QtWebEngineCore \
            --hidden-import PySide6.QtWebChannel \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --collect-all sherpa_onnx \
            --collect-all pystray \
            --collect-all kokoro_onnx \
            --collect-all espeakng_loader \
            --copy-metadata kokoro-onnx \
            --hidden-import misaki.espeak \
            dictado/src/instant2_app/__main__.py

      - name: Build Windows installer (onedir + Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ICON_PATH="$(python -c 'import os; print(os.path.abspath("dictado/build/instant2.ico"))')"
          pyinstaller --noconfirm --onedir --windowed --name Instant2 \
            --icon "$ICON_PATH" \
            --hidden-import instant2_app.gui \
            --hidden-import instant2_app.branding \
            --hidden-import pyexpat \
            --hidden-import PySide6.QtQml \
            --hidden-import PySide6.QtQuick \
            --additional-hooks-dir dictado/hooks \
            --add-data "dictado/src/instant2_app/qml/overlay_web_host.qml;instant2_app/qml" \
            --add-data "dictado/src/instant2_app/qml/panel_web_host.qml;instant2_app/qml" \
            --add-data "dictado/src/instant2_app/web/overlay.html;instant2_app/web" \
            --add-data "dictado/src/instant2_app/web/panel.html;instant2_app/web" \
            --add-data "dictado/src/instant2_app/web/Manrope.ttf;instant2_app/web" \
            --add-data "dictado/src/instant2_app/web/Manrope-OFL.txt;instant2_app/web" \
            --add-data "scripts/instant2-update.bat;." \
            --hidden-import PySide6.QtWebEngineQuick \
            --hidden-import PySide6.QtWebEngineCore \
            --hidden-import PySide6.QtWebChannel \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --collect-all sherpa_onnx \
            --collect-all pystray \
            --collect-all kokoro_onnx \
            --collect-all espeakng_loader \
            --copy-metadata kokoro-onnx \
            --hidden-import misaki.espeak \
            dictado/src/instant2_app/__main__.py
          # Reuse only verified local assets; CI fetches the same pinned models.
          python scripts/prepare_offline_bundle.py \
            --app-dir dist/Instant2 \
            --payload-dir dist/Instant2-Models
          VERSION="$(python -c 'import sys; sys.path.insert(0, "dictado/src"); from instant2_app import __version__; print(__version__)')"
          SOURCE="$(python -c 'import os; print(os.path.abspath("dist/Instant2"))')"
          MODELS="$(python -c 'import os; print(os.path.abspath("dist/Instant2-Models"))')"
          # Inno Setup viene preinstalado en las imágenes de los runners.
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then ISCC="/c/Program Files/Inno Setup 6/ISCC.exe"; fi
          if [ ! -f "$ISCC" ]; then ISCC="iscc"; fi
          # MSYS (git-bash del runner) reescribe los argumentos que empiezan con
          # `/` a rutas de Windows: sin excluir la conversión, ISCC recibe
          # `DAppVersion=...` y lo toma como nombre de script (falla con
          # "You may not specify more than one script filename").
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' \
            "$ISCC" "/DAppVersion=$VERSION" "/DSourceDir=$SOURCE" \
            "/DModelDir=$MODELS" "/DIconFile=$ICON_PATH" installer/instant2.iss
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("dist").glob("Instant2-Setup*"))
          binaries = [path for path in files
                      if path.suffix.lower() in (".exe", ".bin")]
          if not any(path.name == "Instant2-Setup.exe" for path in binaries):
              raise SystemExit("Inno Setup no generó Instant2-Setup.exe")
          for path in binaries:
              if path.stat().st_size >= 2_000_000_000:
                  raise SystemExit(f"El asset excede 2 GB: {path.name}")
          print("Instalador offline listo:", ", ".join(path.name for path in binaries))
          PY

      - name: Prepare macOS signing identity (optional)
        if: runner.os == 'macOS' && vars.ENABLE_CODE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "ENABLE_CODE_SIGNING=true requiere configurar el secreto $name." >&2
              exit 1
            fi
          done
          CERT_PATH="$RUNNER_TEMP/instant2-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/instant2-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          export CERT_PATH
          python3 -c 'import base64,os; open(os.environ["CERT_PATH"],"wb").write(base64.b64decode(os.environ["APPLE_CERTIFICATE_BASE64"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            grep -F "$APPLE_SIGNING_IDENTITY"
          rm -f "$CERT_PATH"
          echo "INSTANT2_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build Unix executable (daemon + panel)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ENABLE_CODE_SIGNING: ${{ vars.ENABLE_CODE_SIGNING }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          WAYLAND_HOTKEY=()
          if [ "${{ matrix.platform }}" = "linux" ]; then
            WAYLAND_HOTKEY+=(--hidden-import instant2_app.wayland_hotkey)
          fi
          MAC_CODESIGN=()
          if [ "${{ matrix.platform }}" = "macos" ] && [ "${ENABLE_CODE_SIGNING:-}" = "true" ]; then
            if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
              echo "ENABLE_CODE_SIGNING=true requiere APPLE_DEVELOPER_IDENTITY." >&2
              exit 1
            fi
            MAC_CODESIGN+=(--codesign-identity "$APPLE_SIGNING_IDENTITY")
          fi
          # El panel y el overlay web son la UI de los tres sistemas: el
          # binario de Linux y macOS lleva PySide6 (QtWebEngine, red del canal
          # de instancia única y módulos QML de los hosts), las páginas web y
          # Pillow para los iconos, además del daemon/CLI de siempre.
          pyinstaller --onefile --name "${{ matrix.binary_name }}" \
            "${WAYLAND_HOTKEY[@]}" \
            "${MAC_CODESIGN[@]}" \
            --hidden-import sherpa_onnx \
            --hidden-import sounddevice \
            --hidden-import instant2_app.gui \
            --hidden-import PySide6.QtNetwork \
            --hidden-import PySide6.QtQml \
            --hidden-import PySide6.QtQuick \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --additional-hooks-dir dictado/hooks \
            --add-data "dictado/src/instant2_app/qml/overlay_web_host.qml:instant2_app/qml" \
            --add-data "dictado/src/instant2_app/qml/panel_web_host.qml:instant2_app/qml" \
            --add-data "dictado/src/instant2_app/web/overlay.html:instant2_app/web" \
            --add-data "dictado/src/instant2_app/web/panel.html:instant2_app/web" \
            --add-data "dictado/src/instant2_app/web/Manrope.ttf:instant2_app/web" \
            --add-data "dictado/src/instant2_app/web/Manrope-OFL.txt:instant2_app/web" \
            --hidden-import PySide6.QtWebEngineQuick \
            --hidden-import PySide6.QtWebEngineCore \
            --hidden-import PySide6.QtWebChannel \
            --collect-all sherpa_onnx \
            --collect-all kokoro_onnx \
            --collect-all espeakng_loader \
            --copy-metadata kokoro-onnx \
            --hidden-import misaki.espeak \
            dictado/src/instant2_app/__main__.py

      - name: Smoke del portable Windows congelado
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "instant2-portable-smoke"
          $appData = Join-Path $root "appdata"
          $localData = Join-Path $root "localdata"
          $modelData = Join-Path $root "models"
          $configDir = Join-Path $appData "instant2"
          New-Item -ItemType Directory -Force -Path $configDir, $localData, $modelData | Out-Null
          $stamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $configDir "config.json"),
            ('{"update_last_check":' + $stamp + '}'), $utf8)
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localData
          $env:INSTANT2_DATA = $modelData
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QTWEBENGINE_CHROMIUM_FLAGS = "--disable-gpu"
          $exe = [System.IO.Path]::GetFullPath("dist/Instant2.exe")
          $process = Start-Process -FilePath $exe -ArgumentList "setup" -PassThru -WindowStyle Hidden
          try {
            $logFile = Join-Path $configDir "instant2.log"
            $deadline = [DateTime]::UtcNow.AddSeconds(75)
            $ready = $false
            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path -LiteralPath $logFile) {
                $ready = (Get-Content -LiteralPath $logFile -Raw -Encoding utf8) -match "panel abierto \(setup\)"
                if ($ready) { break }
              }
              $process.Refresh()
              if ($process.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              if (Test-Path -LiteralPath $logFile) { Get-Content -LiteralPath $logFile -Tail 40 -Encoding utf8 }
              throw "El portable Windows no abrió el panel congelado."
            }
            Start-Sleep -Seconds 3
            "portable Windows congelado OK"
          } finally {
            $running = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $exe }
            foreach ($item in $running) {
              Stop-Process -Id $item.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke del binario congelado (panel con WebEngine)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/${{ matrix.binary_name }} --version
          export HOME="$(mktemp -d)"
          # Aislar también XDG: el runner trae XDG_CONFIG_HOME propio y
          # config_dir() lo prefiere sobre $HOME (el log caía fuera del tmp).
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export INSTANT2_DATA="$HOME/models"
          export QT_QPA_PLATFORM=offscreen
          # run_gui exige un entorno gráfico declarado; la plataforma offscreen
          # hace el trabajo, pero el gate mira DISPLAY.
          export DISPLAY="${DISPLAY:-:0}"
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu"
          ./dist/${{ matrix.binary_name }} setup &
          PID=$!
          LOGS=("$HOME/.config/instant2/instant2.log" "$HOME/Library/Application Support/instant2/instant2.log")
          OK=""
          for _ in $(seq 1 90); do
            for log in "${LOGS[@]}"; do
              if grep -q "panel abierto (setup)" "$log" 2>/dev/null; then OK=1; fi
            done
            [ -n "$OK" ] && break
            sleep 1
          done
          kill $PID 2>/dev/null || true
          [ -n "$OK" ] || {
            echo "el panel congelado no abrió (WebEngine no arrancó):"
            cat "${LOGS[@]}" 2>/dev/null | tail -40
            exit 1
          }
          echo "panel congelado OK"

      - name: Sign Windows binaries (optional)
        if: runner.os == 'Windows' && vars.ENABLE_CODE_SIGNING == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "ENABLE_CODE_SIGNING=true requiere el PFX y su password en Actions secrets."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "instant2-signing.pfx"
          try {
            [System.IO.File]::WriteAllBytes(
              $pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $sdk = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) `
              "Windows Kits/10/bin"
            $signtool = Get-ChildItem -LiteralPath $sdk -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "No se encontró SignTool en Windows SDK." }
            foreach ($file in @("dist/Instant2.exe", "dist/Instant2-Setup.exe")) {
              & $signtool.FullName sign /fd SHA256 /f $pfx `
                /p $env:SIGNING_PFX_PASSWORD /tr https://timestamp.digicert.com `
                /td SHA256 $file
              if ($LASTEXITCODE -ne 0) { throw "Falló la firma de $file." }
              & $signtool.FullName verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "No se pudo verificar la firma de $file." }
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Sign, notarize and staple macOS app (optional)
        if: runner.os == 'macOS' && vars.ENABLE_CODE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "ENABLE_CODE_SIGNING=true requiere configurar el secreto $name." >&2
              exit 1
            fi
          done
          PROFILE="instant2-notary-$GITHUB_RUN_ID"
          KEYCHAIN_PATH="$INSTANT2_SIGNING_KEYCHAIN"

          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" dist/instant2-macos
          APP="dist/Instant2.app"
          mkdir -p "$APP/Contents/MacOS"
          cp dist/instant2-macos "$APP/Contents/MacOS/instant2-macos"
          VERSION="$(python3 -c 'import sys; sys.path.insert(0, "dictado/src"); from instant2_app import __version__; print(__version__)')"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>instant2-macos</string>
            <key>CFBundleIdentifier</key><string>com.instant2.dictado</string>
            <key>CFBundleName</key><string>Instant2</string>
            <key>CFBundleDisplayName</key><string>Instant2</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>NSMicrophoneUsageDescription</key><string>Instant2 usa el micrófono para transcribir dictados localmente.</string>
          </dict></plist>
          PLIST
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil create -volname Instant2 -srcfolder "$APP" -ov -format UDZO \
            dist/Instant2-macos.dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
            dist/Instant2-macos.dmg
          xcrun notarytool store-credentials "$PROFILE" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --keychain "$KEYCHAIN_PATH"
          xcrun notarytool submit dist/Instant2-macos.dmg \
            --keychain-profile "$PROFILE" --keychain "$KEYCHAIN_PATH" --wait
          xcrun stapler staple dist/Instant2-macos.dmg
          xcrun stapler validate dist/Instant2-macos.dmg
          spctl --assess --type execute --verbose=2 "$APP"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 dist/Instant2-macos.dmg

      - name: Hash notarized macOS disk image
        if: runner.os == 'macOS' && vars.ENABLE_CODE_SIGNING == 'true'
        shell: bash
        run: |
          python3 -c "import hashlib; name='Instant2-macos.dmg'; data=open('dist/'+name,'rb').read(); open('dist/'+name+'.sha256','w').write(f'{hashlib.sha256(data).hexdigest()}  {name}\\n')"

      # SHA256 != firma: el sidecar solo detecta descargas corruptas, no un
      # release comprometido. La prueba criptográfica la da la atestación
      # SLSA del job `provenance` (OIDC de GitHub, sin secretos).
      - name: Hash binary sidecar (SHA256 for the updater)
        # Python en vez de sha256sum: macOS no lo trae y el sidecar tiene
        # que salir igual en los tres sistemas o el updater lo rechaza.
        run: |
          python -c "import hashlib; data = open('dist/${{ matrix.output }}','rb').read(); open('dist/${{ matrix.output }}.sha256','w').write(f'{hashlib.sha256(data).hexdigest()}  ${{ matrix.output }}\n')"

      - name: SHA256 sidecar for the installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(path for path in Path("dist").glob("Instant2-Setup*")
                         if path.suffix.lower() in (".exe", ".bin"))
          for path in files:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(block)
              path.with_name(path.name + ".sha256").write_text(
                  f"{digest.hexdigest()}  {path.name}\n", encoding="ascii")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instant2-${{ matrix.platform }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256

      - name: Upload installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instant2-windows-installer
          path: |
            dist/Instant2-Setup*

      - name: Upload notarized macOS disk image
        if: runner.os == 'macOS' && vars.ENABLE_CODE_SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instant2-macos-dmg
          path: |
            dist/Instant2-macos.dmg
            dist/Instant2-macos.dmg.sha256

      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS' && vars.ENABLE_CODE_SIGNING == 'true'
        shell: bash
        run: |
          if [ -n "${INSTANT2_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$INSTANT2_SIGNING_KEYCHAIN" || true
          fi

  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Generate SBOM (SPDX, solo manifiesto fuente)
        # syft directo (v1.20.0, tarball verificado por SHA256): la
        # sbom-action no puede subir artefactos en este repo y su
        # output-file se ignora en la versión fijada.
        run: |
          SYFT_SHA="689e12c5cbf67521ce61b9c126068f9eaabe1223e77971b2fede50033ff6b5cc"
          curl -sSL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v1.20.0/syft_1.20.0_linux_amd64.tar.gz"
          echo "${SYFT_SHA}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          /tmp/syft packages dir:./dictado -o spdx-json=/tmp/instant2-sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instant2-sbom
          path: /tmp/instant2-sbom.spdx.json
          if-no-files-found: error

  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: instant2-*
          path: release-assets
          merge-multiple: true
      - name: Attest build provenance (SLSA, OIDC sin secretos)
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: release-assets/*

  publish:
    needs: [build, sbom, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: instant2*
          path: release-assets
          merge-multiple: true

      - name: Prepare release title
        id: release_meta
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#instant2-v}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: Instant2 v${{ steps.release_meta.outputs.version }}
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
